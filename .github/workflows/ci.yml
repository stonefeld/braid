name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compat:
    # Both, because the invariants differ by platform: macOS is where bash 3.2 is real,
    # and Linux is where /bin/sh is dash rather than bash in POSIX mode. A check that
    # only ran on one would pass while the other was already broken.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: versions
        run: |
          bash --version | head -1
          /bin/bash --version | head -1
          python3 --version
          git --version
      # One step per suite rather than ./test.sh, so a red build names which one on the
      # summary page. ./test.sh is what you run locally, and compat checks it is the same
      # set.
      - name: invariants
        run: bash test/compat.sh
      - name: the slice parser
        run: bash test/slice.sh
      - name: the scheduler
        run: bash test/schedule.sh
      - name: a whole feature, end to end
        run: bash test/e2e.sh

  # The shellcheck compat.sh finds is whatever the runner ships, which is not the pinned
  # one, so it reports the mismatch and leaves the verdict to the job below.
  shellcheck:
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: "0.11.0"
    steps:
      - uses: actions/checkout@v4
      # Pinned, not apt's. Different versions flag different things, so an unpinned
      # linter makes "clean on my machine" and "clean in CI" two different claims — and
      # the difference only ever shows up as a red build on a commit that passed locally.
      - name: install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - --strip-components=1 -C /usr/local/bin "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version
      - name: engine
        run: shellcheck --shell=bash bin/braid lib/*.sh lib/agents/*.sh lib/launchers/*.sh lib/templates/*.sh test/*.sh test.sh
      - name: installer
        # Separately, and as sh: it is the one file that must not be bash.
        run: shellcheck --shell=sh install.sh

  install:
    # The claim the installer makes is "this works on a machine that has nothing set up
    # yet". The only way to keep that true is to run it on one.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install from the checkout
        run: sh ./install.sh --prefix "$HOME/.local/bin"
      - name: the dispatcher resolves its engine through the symlink
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          braid version
          braid help
      - name: an unknown command exits non-zero
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if braid nonsense >/dev/null 2>&1; then exit 1; fi
      - name: re-installing is idempotent
        run: sh ./install.sh --prefix "$HOME/.local/bin"
